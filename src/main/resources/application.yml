spring:
  config:
    # Reads GEMINI_API_KEY from a local .env file if present (gitignored).
    # A real environment variable still works and takes precedence.
    import: optional:file:.env[.properties]
  application:
    name: analyst-desk
  ai:
    mcp:
      server:
        name: analyst-desk
        version: 0.4.0
        type: SYNC
        # Streamable HTTP: one endpoint, served by this same Spring MVC app.
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
    google:
      genai:
        # Key comes from the environment only. Never commit it.
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
            temperature: 0.2

analyst:
  structured:
    max-attempts: 3
  data:
    financials: data/financials.csv
    docs: data/docs
  loop:
    max-steps: 6
