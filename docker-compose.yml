services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: analystdesk
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analystdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Embeddings (Phase 6) and fallback chat model (Phase 16) live here.
  # Phase 1 only needs it running; models are pulled in later phases.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
